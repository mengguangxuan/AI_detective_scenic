<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeepSeek场景制作进度</title><style>body{font:16px system-ui;background:#f0eee7;color:#293a32;max-width:900px;margin:40px auto;padding:0 20px}article{background:white;border:1px solid #c8cec5;border-radius:12px;padding:22px;margin:15px 0}h1{font-size:25px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px ui-monospace}a,button{background:#315c47;color:white;border:0;border-radius:6px;padding:10px 14px;text-decoration:none}small{color:#52665a}#preview{display:none}textarea{width:100%;min-height:100px}</style></head><body><h1>DeepSeek 场景制作</h1><p>原始字段 → 模型规划 → 模块与组装器 → 实际截图 → 两次独立上下文审核</p><article><h2 id="stage">读取状态……</h2><p id="details"></p><small id="usage"></small><p><a href="/inspect?view=1" id="inspection" style="display:none">查看当前未验收结果（静态）</a></p><p><a id="preview" href="/preview">打开已通过验收的场景</a></p><p><a href="/api/status" target="_blank">状态 JSON</a> <a href="/api/input" target="_blank">本次原始输入</a></p></article><article><h2>最近进度</h2><pre id="events"></pre></article><article id="problems"><h2>当前问题与待补字段</h2><pre id="issues"></pre></article><script>
async function refresh(){try{const r=await fetch('/api/status',{cache:'no-store'});const s=await r.json();document.querySelector('#stage').textContent=s.stageLabel??s.stage;document.querySelector('#details').textContent=(s.message??'')+'\n任务：'+s.id;document.querySelector('#usage').textContent='自动处理轮数 '+(s.round??0)+' / '+(s.limits?.maxRounds??10)+'；运行检查 '+(s.progress?.runtimeCheckAttempts??0)+' 次，视觉审核 '+(s.progress?.visualReviewAttempts??0)+' 次，整体复核 '+(s.progress?.overallReviewAttempts??0)+' 次；已调用 '+s.calls+' 次；已报告用量 '+s.tokens+' tokens。首次调用：'+(s.firstCallSucceeded?'成功':'等待确认');document.querySelector('#events').textContent=(s.events??[]).map(e=>e.time+' '+e.message).join('\n');document.querySelector('#issues').textContent=JSON.stringify(s.issues??[],null,2);document.querySelector('#inspection').style.display=s.authorInspection?'inline-block':'none';document.querySelector('#preview').style.display=s.stage==='passed'?'inline-block':'none';}catch(e){document.querySelector('#stage').textContent='暂时无法连接任务服务';}}refresh();setInterval(refresh,2000);
</script></body></html>
